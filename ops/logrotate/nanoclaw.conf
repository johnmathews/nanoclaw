# Rotation for the host's systemd-captured logs. Run by the systemd *user*
# timer nanoclaw-logrotate.timer (no root needed) with its own state file.
# Install/refresh: ops/logrotate/install.sh
#
# copytruncate is required and safe: the unit opens both files with
# StandardOutput/StandardError=append:, i.e. O_APPEND, so after truncation the
# writer continues at the new EOF (no sparse file, no restart, no signal).
/srv/apps/nanoclaw/logs/nanoclaw.log /srv/apps/nanoclaw/logs/nanoclaw.error.log {
    daily
    maxsize 50M
    rotate 14
    missingok
    notifempty
    copytruncate
    compress
    dateext
    dateformat -%Y%m%d-%H%M%S
}
